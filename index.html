<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CreatorDock Viewfinder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #020617; overscroll-behavior-y: none; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-slate-100 overflow-hidden font-sans">

    <!-- Header & Logo Standard CreatorDock -->
    <header class="absolute top-0 left-0 w-full z-50 flex justify-between items-center px-4 py-3 bg-gradient-to-b from-slate-950/90 to-transparent">
        <div class="flex items-center gap-2">
            <img src="https://creatordock.online/wp-content/uploads/2026/10/Logo-transparan-creatordock-putih.png" alt="CreatorDock" class="h-6 object-contain">
            <span class="text-xs font-bold tracking-widest text-amber-500 uppercase">Viewfinder</span>
        </div>
        <div class="text-right">
            <div id="camDisplay" class="text-sm font-bold">ARRI ALEXA 35</div>
            <div id="gpsDisplay" class="text-[10px] text-slate-400">GPS: MENCARI...</div>
        </div>
    </header>

    <!-- Kamera Sensor Selector -->
    <div class="absolute top-14 left-0 w-full z-40 px-4 py-2 overflow-x-auto hide-scrollbar">
        <div class="flex gap-2" id="cameraTrack">
            <button class="cam-chip active px-4 py-1.5 rounded-full text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-colors" onclick="selectCamera('ARRI Alexa 35', 27.99, 19.22, this)">ARRI Alexa 35</button>
            <button class="cam-chip px-4 py-1.5 rounded-full text-xs font-bold border border-slate-700 bg-slate-900/80 text-slate-300 transition-colors" onclick="selectCamera('RED Komodo 6K', 27.03, 14.26, this)">RED Komodo</button>
            <button class="cam-chip px-4 py-1.5 rounded-full text-xs font-bold border border-slate-700 bg-slate-900/80 text-slate-300 transition-colors" onclick="selectCamera('Sony Venice 2', 35.90, 24.00, this)">Sony Venice 2</button>
        </div>
    </div>

    <!-- Canvas Viewfinder Utama -->
    <div class="flex-1 relative bg-black flex items-center justify-center w-full h-full viewfinder-container">
        <canvas id="viewfinderCanvas" class="w-full h-full object-contain"></canvas>
        <video id="rawVideo" autoplay playsinline class="hidden"></video>
        
        <!-- Toggle Komposisi -->
        <button onclick="toggleGrid()" class="absolute right-4 top-1/2 -translate-y-1/2 p-3 rounded-full bg-slate-800/80 border border-slate-600 text-white shadow-lg backdrop-blur">
            <i data-lucide="grid-3x3" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- Control Panel Bawah (Glassmorphism) -->
    <div class="glass-panel w-full pb-6 pt-4 px-4 z-50 flex flex-col gap-4">
        <!-- Lens Selector -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-2">
            <button class="btn-lens px-5 py-2 rounded-xl text-sm font-semibold bg-slate-800 border border-slate-600" onclick="setLens(18, this)">18mm</button>
            <button class="btn-lens px-5 py-2 rounded-xl text-sm font-semibold bg-slate-800 border border-slate-600" onclick="setLens(24, this)">24mm</button>
            <button class="btn-lens active px-5 py-2 rounded-xl text-sm font-semibold bg-amber-500 text-slate-950 border border-amber-400" onclick="setLens(35, this)">35mm</button>
            <button class="btn-lens px-5 py-2 rounded-xl text-sm font-semibold bg-slate-800 border border-slate-600" onclick="setLens(50, this)">50mm</button>
            <button class="btn-lens px-5 py-2 rounded-xl text-sm font-semibold bg-slate-800 border border-slate-600" onclick="setLens(85, this)">85mm</button>
        </div>

        <!-- Action Row -->
        <div class="flex justify-between items-center">
            <select id="shotSize" class="bg-slate-900 border border-slate-700 text-sm rounded-lg p-3 w-1/3 outline-none focus:border-amber-500">
                <option value="WS">Wide Shot (WS)</option>
                <option value="MS">Medium Shot (MS)</option>
                <option value="MCU" selected>Medium Close Up (MCU)</option>
                <option value="CU">Close Up (CU)</option>
            </select>

            <!-- Shutter Button -->
            <button class="btn-capture w-16 h-16 rounded-full bg-white border-4 border-slate-400 flex items-center justify-center active:scale-95 transition-transform" onclick="triggerCapture()">
                <div class="w-12 h-12 rounded-full border-2 border-slate-200"></div>
            </button>
            
            <div class="w-1/3 text-right">
                <span id="aspectDisplay" class="text-sm font-bold text-amber-500">2.39:1</span>
            </div>
        </div>
    </div>

    <!-- PWA Setup & Scripts -->
    <script src="app.js"></script>
    <script src="local-render.js"></script>
    <script src="sync.js"></script>
    <script>
        lucide.createIcons();
        function selectCamera(name, width, height, el) {
            document.querySelectorAll('.cam-chip').forEach(btn => {
                btn.className = "cam-chip px-4 py-1.5 rounded-full text-xs font-bold border border-slate-700 bg-slate-900/80 text-slate-300 transition-colors";
            });
            el.className = "cam-chip active px-4 py-1.5 rounded-full text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-colors";
            document.getElementById('camDisplay').innerText = name.toUpperCase();
            
            if (typeof targetCamera !== 'undefined') {
                targetCamera.brand = name.split(' ')[0];
                targetCamera.model = name.split(' ').slice(1).join(' ');
                targetCamera.sensorWidth = width;
                targetCamera.sensorHeight = height;
            }
        }

        function setLens(mm, el) {
            document.querySelectorAll('.btn-lens').forEach(btn => {
                btn.className = "btn-lens px-5 py-2 rounded-xl text-sm font-semibold bg-slate-800 border border-slate-600 text-slate-100";
            });
            el.className = "btn-lens active px-5 py-2 rounded-xl text-sm font-semibold bg-amber-500 text-slate-950 border border-amber-400";
            if (typeof activeLens !== 'undefined') activeLens = mm;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</body>
</html>
