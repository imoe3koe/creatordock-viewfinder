<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CreatorDock Viewfinder Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020617; color: #f8fafc; overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; overscroll-behavior-y: none;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .viewfinder-container {
            flex: 1; width: 100%; min-height: 0; position: relative; 
            display: flex; justify-content: center; align-items: center; background: #000;
        }
        #viewfinderCanvas { width: 100%; height: 100%; object-fit: contain; }

        .glass-panel {
            flex-shrink: 0; min-height: 120px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); 
            border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 40;
            padding-bottom: max(env(safe-area-inset-bottom), 16px);
        }
    </style>
</head>
<body class="antialiased">

    <!-- HEADER -->
    <header class="w-full border-b border-slate-800 bg-slate-950/90 sticky top-0 z-40 backdrop-blur flex flex-col pt-safe">
        <div class="px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://creatordock.online/wp-content/uploads/2026/10/Logo-transparan-creatordock-putih.png" alt="Logo" class="h-5 sm:h-6 object-contain">
                <span class="text-xs font-bold tracking-widest text-amber-500 uppercase border-l border-slate-700 pl-2">Viewfinder</span>
            </div>
            <div class="text-right">
                <div id="camDisplay" class="text-xs sm:text-sm font-bold text-slate-100 uppercase">ARRI ALEXA 35</div>
                <div id="gpsDisplay" class="text-[9px] text-slate-400 font-mono">GPS: MENCARI...</div>
            </div>
        </div>
        
        <!-- Sensor Selector Track -->
        <div class="px-4 pb-3 overflow-x-auto hide-scrollbar">
            <div class="flex gap-2 w-max" id="cameraTrack">
                <button class="cam-chip active px-4 py-1.5 rounded-full text-[11px] font-bold border border-amber-500 bg-amber-500 text-slate-950 cursor-pointer" onclick="selectCamera('ARRI Alexa 35', 27.99, 19.22, this)">ARRI Alexa 35</button>
                <button class="cam-chip px-4 py-1.5 rounded-full text-[11px] font-bold border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer" onclick="selectCamera('RED Komodo', 27.03, 14.26, this)">RED Komodo</button>
                <button class="cam-chip px-4 py-1.5 rounded-full text-[11px] font-bold border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer" onclick="selectCamera('Sony Venice 2', 35.90, 24.00, this)">Sony Venice 2</button>
            </div>
        </div>
    </header>

    <!-- KANVAS UTAMA -->
    <div class="viewfinder-container">
        <canvas id="viewfinderCanvas"></canvas>
        <video id="rawVideo" autoplay playsinline muted class="hidden"></video>
        
        <button onclick="toggleGrid()" class="absolute right-4 top-1/2 -translate-y-1/2 p-3 rounded-full bg-slate-900/60 border border-slate-600 text-white shadow-lg backdrop-blur z-10 cursor-pointer" aria-label="Toggle Grid">
            <i data-lucide="grid-3x3" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- PANEL KONTROL BAWAH -->
    <div class="glass-panel w-full flex flex-col justify-center px-4 py-3 gap-3">
        <!-- Lens Track -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar w-max mx-auto">
            <button class="btn-lens px-5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(18, this)">18mm</button>
            <button class="btn-lens px-5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(24, this)">24mm</button>
            <button class="btn-lens active px-5 py-1.5 rounded-xl text-xs font-semibold bg-amber-500 text-slate-950 border border-amber-400 cursor-pointer" onclick="setLens(35, this)">35mm</button>
            <button class="btn-lens px-5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(50, this)">50mm</button>
            <button class="btn-lens px-5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(85, this)">85mm</button>
        </div>

        <!-- Action Row -->
        <div class="flex justify-between items-center w-full">
            <div class="w-[35%]">
                <select id="shotSize" class="bg-slate-900 border border-slate-700 text-xs rounded-lg p-2.5 w-full outline-none focus:border-amber-500 text-slate-200 cursor-pointer">
                    <option value="WS">Wide (WS)</option>
                    <option value="MS">Medium (MS)</option>
                    <option value="MCU" selected>Med. Close Up (MCU)</option>
                    <option value="CU">Close Up (CU)</option>
                </select>
            </div>

            <div class="w-[30%] flex justify-center">
                <button class="btn-capture w-14 h-14 rounded-full bg-slate-200 border-[3px] border-slate-400 flex items-center justify-center shadow-lg active:scale-95 transition-transform cursor-pointer" onclick="triggerCapture()" aria-label="Shutter">
                    <div class="w-10 h-10 rounded-full border-[3px] border-slate-100 bg-white shadow-inner"></div>
                </button>
            </div>
            
            <div class="w-[35%] text-right">
                <div class="text-[9px] text-slate-400 uppercase tracking-widest">Format</div>
                <div id="aspectDisplay" class="text-sm font-bold text-amber-500">2.39:1</div>
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA TERPADU (MENCEGAH ERROR 404 & FUNGSI HILANG) -->
    <script>
        lucide.createIcons();

        // State Global
        window.targetCamera = { brand: "ARRI", model: "Alexa 35", sensorWidth: 27.99, sensorHeight: 19.22 };
        window.activeLens = 35;       
        window.targetAspectRatio = 2.39; 
        window.showRuleOfThirds = true;

        const baseHPCamera = { equivalentFocalLength: 24, fullFrameWidth: 36.00 };
        let streamVideo = null;
        let previewCanvas = null;
        let ctx = null;
        let animationFrameId;

        // Inisialisasi Kamera (Support Mobile iOS & Android / Desktop Fallback)
        async function initCamera() {
            streamVideo = document.getElementById('rawVideo');
            previewCanvas = document.getElementById('viewfinderCanvas');
            if(!streamVideo || !previewCanvas) return; 
            ctx = previewCanvas.getContext('2d', { alpha: false });

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                streamVideo.srcObject = stream;
                streamVideo.addEventListener('loadedmetadata', () => {
                    streamVideo.play().catch(e => console.warn("Autoplay terhalang:", e));
                    setupCanvasDimensions();
                    startLiveViewRendering();
                    getUserCurrentLocation();
                });
            } catch (err) {
                console.warn("Kamera utama gagal, mencoba webcam default...", err);
                fallbackCamera();
            }
        }

        async function fallbackCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                streamVideo.srcObject = stream;
                streamVideo.addEventListener('loadedmetadata', () => {
                    streamVideo.play();
                    setupCanvasDimensions();
                    startLiveViewRendering();
                });
            } catch (e) {
                if(ctx && previewCanvas) {
                    ctx.fillStyle = "#020617"; ctx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
                    ctx.fillStyle = "#ef4444"; ctx.font = "14px sans-serif"; ctx.textAlign = "center";
                    ctx.fillText("Izin Kamera Diperlukan / Tidak Ditemukan", previewCanvas.width/2, previewCanvas.height/2);
                }
            }
        }

        function setupCanvasDimensions() {
            const container = document.querySelector('.viewfinder-container');
            if(!container || !previewCanvas) return;
            previewCanvas.width = container.clientWidth * window.devicePixelRatio;
            previewCanvas.height = container.clientHeight * window.devicePixelRatio;
        }

        function startLiveViewRendering() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            function renderFrame() {
                if (streamVideo && streamVideo.readyState === streamVideo.HAVE_CURRENT_DATA) {
                    ctx.fillStyle = "#020617";
                    ctx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

                    const targetAoV = 2 * Math.atan(window.targetCamera.sensorWidth / (2 * window.activeLens));
                    const hpAoV = 2 * Math.atan(baseHPCamera.fullFrameWidth / (2 * baseHPCamera.equivalentFocalLength));
                    const cropRatio = hpAoV / targetAoV;

                    const videoW = streamVideo.videoWidth; const videoH = streamVideo.videoHeight;
                    let srcW = videoW / cropRatio; let srcH = videoH / cropRatio;
                    if (srcW > videoW) { srcW = videoW; srcH = videoH; }
                    const srcX = (videoW - srcW) / 2; const srcY = (videoH - srcH) / 2;

                    const canvasW = previewCanvas.width; const canvasH = previewCanvas.height;
                    let destW = canvasW; let destH = canvasW / window.targetAspectRatio;
                    if (destH > canvasH) { destH = canvasH; destW = canvasH * window.targetAspectRatio; }

                    const destX = (canvasW - destW) / 2; const destY = (canvasH - destH) / 2;

                    ctx.drawImage(streamVideo, srcX, srcY, srcW, srcH, destX, destY, destW, destH);

                    if (window.showRuleOfThirds) {
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                        ctx.lineWidth = Math.max(1, 2 * window.devicePixelRatio);
                        ctx.beginPath();
                        ctx.moveTo(destX + destW / 3, destY); ctx.lineTo(destX + destW / 3, destY + destH);
                        ctx.moveTo(destX + (destW / 3) * 2, destY); ctx.lineTo(destX + (destW / 3) * 2, destY + destH);
                        ctx.moveTo(destX, destY + destH / 3); ctx.lineTo(destX + destW, destY + destH / 3);
                        ctx.moveTo(destX, destY + (destH / 3) * 2); ctx.lineTo(destX + destW, destY + (destH / 3) * 2);
                        ctx.stroke();
                    }

                    ctx.fillStyle = "rgba(0, 0, 0, 0.95)";
                    ctx.fillRect(0, 0, canvasW, destY);
                    ctx.fillRect(0, destY + destH, canvasW, canvasH - (destY + destH));
                    ctx.fillRect(0, destY, destX, destH);
                    ctx.fillRect(destX + destW, destY, canvasW - (destX + destW), destH);
                }
                animationFrameId = requestAnimationFrame(renderFrame);
            }
            renderFrame();
        }

        // Bridge & UI Actions
        window.selectCamera = function(name, width, height, el) {
            document.querySelectorAll('.cam-chip').forEach(btn => {
                btn.className = "cam-chip px-4 py-1.5 rounded-full text-[11px] font-bold border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer";
            });
            el.className = "cam-chip active px-4 py-1.5 rounded-full text-[11px] font-bold border border-amber-500 bg-amber-500 text-slate-950 cursor-pointer";
            document.getElementById('camDisplay').innerText = name.toUpperCase();
            window.targetCamera = { brand: name.split(' ')[0], model: name.split(' ').slice(1).join(' '), sensorWidth: width, sensorHeight: height };
        };

        window.setLens = function(mm, el) {
            document.querySelectorAll('.btn-lens').forEach(btn => {
                btn.className = "btn-lens px-5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer";
            });
            el.className = "btn-lens active px-5 py-1.5 rounded-xl text-xs font-semibold bg-amber-500 text-slate-950 border border-amber-400 cursor-pointer";
            window.activeLens = mm;
        };

        window.toggleGrid = function() { window.showRuleOfThirds = !window.showRuleOfThirds; };

        // GPS Geolocation
        function getUserCurrentLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ latitude: 0, longitude: 0 }); return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const ui = document.getElementById('gpsDisplay');
                        if (ui) ui.innerText = `GPS: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
                        resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude });
                    },
                    () => {
                        const ui = document.getElementById('gpsDisplay');
                        if (ui) ui.innerText = "GPS: OFF";
                        resolve({ latitude: 0.0, longitude: 0.0 });
                    }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            });
        }

        // Trigger Capture & Burn-In Local Export
        window.triggerCapture = async function() {
            const loc = await getUserCurrentLocation();
            const latLonText = loc.latitude ? `${loc.latitude.toFixed(4)}, ${loc.longitude.toFixed(4)}` : "GPS Disabled";
            
            const selectedShot = document.getElementById('shotSize').value;
            const activeLensText = window.activeLens + "mm";
            const cameraText = `${window.targetCamera.brand} ${window.targetCamera.model}`;
            
            const outputCanvas = document.createElement('canvas');
            const outCtx = outputCanvas.getContext('2d', { alpha: false });
            const W = 1920; const H = 1080;
            outputCanvas.width = W; outputCanvas.height = H;
            
            let destW = W; let destH = H; let destX = 0; let destY = 0;

            if (streamVideo && streamVideo.videoWidth > 0) {
                let targetAoV = 2 * Math.atan(window.targetCamera.sensorWidth / (2 * window.activeLens));
                const hpAoV = 2 * Math.atan(baseHPCamera.fullFrameWidth / (2 * baseHPCamera.equivalentFocalLength));
                const cropRatio = hpAoV / targetAoV;
                let srcW = streamVideo.videoWidth / cropRatio; let srcH = streamVideo.videoHeight / cropRatio;
                if (srcW > streamVideo.videoWidth) { srcW = streamVideo.videoWidth; srcH = streamVideo.videoHeight; }
                const srcX = (streamVideo.videoWidth - srcW) / 2; const srcY = (streamVideo.videoHeight - srcH) / 2;

                destH = W / window.targetAspectRatio; destX = (W - destW) / 2; destY = (H - destH) / 2;
                outCtx.drawImage(streamVideo, srcX, srcY, srcW, srcH, destX, destY, destW, destH);
            }

            // Letterbox Masking
            outCtx.fillStyle = "#000000";
            outCtx.fillRect(0, 0, W, destY); 
            outCtx.fillRect(0, destY + destH, W, H - (destY + destH)); 

            // Burn-In Metadata
            outCtx.fillStyle = "#FFFFFF"; outCtx.font = "bold 28px sans-serif"; outCtx.textBaseline = "middle";
            outCtx.fillText(`CAM: ${cameraText.toUpperCase()}`, 40, destY / 2);
            outCtx.textAlign = "right"; outCtx.fillText(`ASPECT: 2.39:1`, W - 40, destY / 2);

            const footerY = destY + destH + ((H - (destY + destH)) / 2);
            outCtx.textAlign = "left"; outCtx.fillStyle = "#F59E0B"; 
            outCtx.fillText(`LENS: ${activeLensText}`, 40, footerY);
            outCtx.fillStyle = "#FFFFFF"; outCtx.fillText(` |  SHOT: ${selectedShot}`, 240, footerY);
            outCtx.textAlign = "right"; outCtx.font = "24px sans-serif"; outCtx.fillText(`GPS: ${latLonText}`, W - 40, footerY);

            try {
                const imageURL = outputCanvas.toDataURL('image/jpeg', 0.90);
                const dlLink = document.createElement('a');
                const ts = new Date().toISOString().replace(/[:.]/g, "-");
                dlLink.download = `CDView_${selectedShot}_${activeLensText}_${ts}.jpg`;
                dlLink.href = imageURL;
                document.body.appendChild(dlLink); dlLink.click();
                setTimeout(() => document.body.removeChild(dlLink), 100);
            } catch (err) {
                alert("Gagal menyimpan gambar lokal. Periksa izin unduhan browser.");
            }
        }

        window.addEventListener('DOMContentLoaded', initCamera);
        window.addEventListener('resize', setupCanvasDimensions);
    </script>
</body>
</html>
