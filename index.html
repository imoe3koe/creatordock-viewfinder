<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CreatorDock Viewfinder Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

        <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', function(event) {
        if (event.keyCode === 123 || (event.ctrlKey && event.shiftKey && event.keyCode === 73) || (event.ctrlKey && event.keyCode === 85)) {
            event.preventDefault();
            alert('Akses inspeksi kode sumber dibatasi oleh sistem keamanan CreatorDock.');
            return false;
        }
    });
    </script>
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020617; color: #f8fafc; overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; overscroll-behavior-y: none;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .viewfinder-container {
            flex: 1; width: 100%; min-height: 0; position: relative; 
            display: flex; justify-content: center; align-items: center; background: #000;
        }
        #viewfinderCanvas { width: 100%; height: 100%; object-fit: contain; }

        .glass-panel {
            flex-shrink: 0; min-height: 120px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); 
            border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 40;
            padding-bottom: max(env(safe-area-inset-bottom), 16px);
        }
        /* Style untuk tombol grid aktif */
        .grid-active {
            background-color: #f59e0b !important;
            color: #020617 !important;
            border-color: #f59e0b !important;
        }
    </style>
</head>
<body class="antialiased">

    <!-- HEADER -->
    <header class="w-full border-b border-slate-800 bg-slate-950/90 sticky top-0 z-40 backdrop-blur flex flex-col pt-safe">
        <div class="px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://creatordock.online/wp-content/uploads/2026/10/Logo-transparan-creatordock-putih.png" alt="Logo" class="h-5 sm:h-6 object-contain">
                <span class="text-xs font-bold tracking-widest text-amber-500 uppercase border-l border-slate-700 pl-2">Viewfinder</span>
            </div>
            <div class="text-right">
                <div id="camDisplay" class="text-xs sm:text-sm font-bold text-slate-100 uppercase">ARRI ALEXA 35</div>
                <div id="gpsDisplay" class="text-[9px] text-slate-400 font-mono">GPS: MENCARI...</div>
            </div>
        </div>
        
        <!-- Sensor Selector Track -->
        <div class="px-4 pb-3 overflow-x-auto hide-scrollbar">
            <div class="flex gap-2 w-max" id="cameraTrack">
                <button class="cam-chip active px-4 py-1.5 rounded-full text-[11px] font-bold border border-amber-500 bg-amber-500 text-slate-950 cursor-pointer" onclick="selectCamera('ARRI Alexa 35', 27.99, 19.22, this)">ARRI Alexa 35</button>
                <button class="cam-chip px-4 py-1.5 rounded-full text-[11px] font-bold border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer" onclick="selectCamera('RED Komodo', 27.03, 14.26, this)">RED Komodo</button>
                <button class="cam-chip px-4 py-1.5 rounded-full text-[11px] font-bold border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer" onclick="selectCamera('Sony Venice 2', 35.90, 24.00, this)">Sony Venice 2</button>
            </div>
        </div>
    </header>

    <!-- KANVAS UTAMA -->
    <div class="viewfinder-container">
        <canvas id="viewfinderCanvas"></canvas>
        <video id="rawVideo" autoplay playsinline muted class="hidden"></video>
        
        <!-- Tombol Grid (Diberi ID agar bisa diubah warnanya oleh JS) -->
        <button id="gridToggleBtn" onclick="toggleGrid(this)" class="absolute right-4 top-1/2 -translate-y-1/2 p-3 rounded-full bg-slate-900/60 border border-slate-600 text-white shadow-lg backdrop-blur z-10 cursor-pointer transition-colors" aria-label="Toggle Grid">
            <i data-lucide="grid-3x3" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- PANEL KONTROL BAWAH -->
    <div class="glass-panel w-full flex flex-col justify-center px-4 py-3 gap-3">
        <!-- Lens Track -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar w-max mx-auto">
            <button class="btn-lens px-5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(18, this)">18mm</button>
            <button class="btn-lens px-5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(24, this)">24mm</button>
            <button class="btn-lens active px-5 py-1.5 rounded-xl text-xs font-semibold bg-amber-500 text-slate-950 border border-amber-400 cursor-pointer" onclick="setLens(35, this)">35mm</button>
            <button class="btn-lens px-5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(50, this)">50mm</button>
            <button class="btn-lens px-5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(85, this)">85mm</button>
        </div>

        <!-- Action Row -->
        <div class="flex justify-between items-center w-full">
            <div class="w-[35%]">
                <select id="shotSize" class="bg-slate-900 border border-slate-700 text-xs rounded-lg p-2.5 w-full outline-none focus:border-amber-500 text-slate-200 cursor-pointer">
                    <option value="WS">Wide (WS)</option>
                    <option value="MS">Medium (MS)</option>
                    <option value="MCU" selected>Med. Close Up (MCU)</option>
                    <option value="CU">Close Up (CU)</option>
                </select>
            </div>

            <div class="w-[30%] flex justify-center">
                <button class="btn-capture w-14 h-14 rounded-full bg-slate-200 border-[3px] border-slate-400 flex items-center justify-center shadow-lg active:scale-95 transition-transform cursor-pointer" onclick="triggerCapture()" aria-label="Shutter">
                    <div class="w-10 h-10 rounded-full border-[3px] border-slate-100 bg-white shadow-inner"></div>
                </button>
            </div>
            
            <div class="w-[35%] text-right">
                <div class="text-[9px] text-slate-400 uppercase tracking-widest">Format</div>
                <div id="aspectDisplay" class="text-sm font-bold text-amber-500">2.39:1</div>
            </div>
        </div>
    </div>

    <!-- MEMUAT ENGINE YANG SUDAH DIPISAH DAN DIOPTIMALKAN -->
    <script src="main-viewfinder.js"></script>
    <script>
        // Inisialisasi Ikon Lucide
        lucide.createIcons();

        // Mendaftarkan Service Worker untuk dukungan PWA (Offline Mode)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Gagal:', err));
            });
        }
    </script>
</body>
</html>
