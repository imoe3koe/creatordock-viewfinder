<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CreatorDock Viewfinder</title>
    <!-- Tailwind & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020617; /* Slate-950 standar CreatorDock */
            color: #f8fafc; overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column;
            overscroll-behavior-y: none;
        }

        /* Sembunyikan scrollbar tapi tetap bisa di-scroll secara horizontal */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 1. Area Kanvas Utama (Otomatis meregang mengisi sisa ruang) */
        .viewfinder-container {
            flex: 1; 
            width: 100%; 
            min-height: 0; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000000;
        }

        #viewfinderCanvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            max-width: 100%;
            max-height: 100%;
        }

        /* 2. Panel Kendali Bawah (Terkunci permanen di bawah, antikempes) */
        .glass-panel {
            flex-shrink: 0; /* Mencegah panel tertekan oleh layar */
            min-height: 130px;
            background: rgba(15, 23, 42, 0.85); /* Slate-900 Glassmorphism */
            backdrop-filter: blur(12px); 
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px 16px 24px 16px;
        }

        /* Efek klik tombol Rana (Shutter) */
        .btn-capture { transition: transform 0.15s ease-out; }
        .btn-capture:active { transform: scale(0.92); }
    </style>
</head>

<body class="antialiased">

    <!-- HEADER: Logo & Indikator Sensor -->
    <header class="w-full z-50 flex justify-between items-center px-4 py-3 border-b border-slate-800 bg-slate-950/90 backdrop-blur shrink-0">
        <div class="flex items-center gap-2">
            <img src="https://creatordock.online/wp-content/uploads/2026/10/Logo-transparan-creatordock-putih.png" alt="CreatorDock" class="h-6 object-contain">
            <span class="text-[10px] sm:text-xs font-bold tracking-widest text-amber-500 uppercase border-l border-slate-700 pl-2">Viewfinder</span>
        </div>
        <div class="text-right">
            <div id="camDisplay" class="text-xs sm:text-sm font-bold text-slate-100 uppercase tracking-wide">ARRI ALEXA 35</div>
            <div id="gpsDisplay" class="text-[9px] sm:text-[10px] text-slate-400 font-mono">GPS: MENCARI...</div>
        </div>
    </header>

    <!-- MENU SCROLL: Sensor Kamera Bioskop -->
    <div class="w-full z-40 px-4 py-2.5 bg-slate-950/80 border-b border-slate-800 shrink-0 overflow-x-auto hide-scrollbar">
        <div class="flex gap-2 w-max" id="cameraTrack">
            <button class="cam-chip active px-4 py-1.5 rounded-full text-[11px] font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-colors cursor-pointer" onclick="selectCamera('ARRI Alexa 35', 27.99, 19.22, this)">ARRI Alexa 35</button>
            <button class="cam-chip px-4 py-1.5 rounded-full text-[11px] font-bold border border-slate-700 bg-slate-900 text-slate-300 transition-colors cursor-pointer" onclick="selectCamera('RED Komodo', 27.03, 14.26, this)">RED Komodo</button>
            <button class="cam-chip px-4 py-1.5 rounded-full text-[11px] font-bold border border-slate-700 bg-slate-900 text-slate-300 transition-colors cursor-pointer" onclick="selectCamera('Sony Venice 2', 35.90, 24.00, this)">Sony Venice 2</button>
        </div>
    </div>

    <!-- KANVAS UTAMA: Manipulasi Kamera Real-Time -->
    <div class="viewfinder-container">
        <canvas id="viewfinderCanvas"></canvas>
        <video id="rawVideo" autoplay playsinline class="hidden"></video>
        
        <!-- Toggle Garis Komposisi (Rule of Thirds) -->
        <button onclick="toggleGrid()" class="absolute right-4 top-1/2 -translate-y-1/2 p-3 rounded-full bg-slate-900/60 border border-slate-600 text-white shadow-lg backdrop-blur hover:bg-slate-800 transition cursor-pointer z-10" aria-label="Toggle Grid">
            <i data-lucide="grid-3x3" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- PANEL KONTROL: Lensa & Eksekusi Gambar -->
    <div class="glass-panel w-full">
        <!-- Lens Selector (Bisa digeser horizontal di layar HP kecil) -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1 w-max mx-auto sm:mx-0">
            <button class="btn-lens px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(18, this)">18mm</button>
            <button class="btn-lens px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(24, this)">24mm</button>
            <button class="btn-lens active px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-amber-500 text-slate-950 border border-amber-400 cursor-pointer" onclick="setLens(35, this)">35mm</button>
            <button class="btn-lens px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(50, this)">50mm</button>
            <button class="btn-lens px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer" onclick="setLens(85, this)">85mm</button>
        </div>

        <!-- Baris Aksi (Dropdown Standar Tembakan, Shutter Bulat, Rasio Aspek) -->
        <div class="flex justify-between items-center w-full max-w-md mx-auto sm:max-w-none px-2">
            
            <div class="w-[35%]">
                <select id="shotSize" class="bg-slate-900/80 border border-slate-700 text-xs sm:text-sm rounded-lg p-2.5 w-full outline-none focus:border-amber-500 text-slate-200 cursor-pointer appearance-none">
                    <option value="WS">Wide (WS)</option>
                    <option value="MS">Medium (MS)</option>
                    <option value="MCU" selected>Med. Close Up (MCU)</option>
                    <option value="CU">Close Up (CU)</option>
                </select>
            </div>

            <!-- Tombol Kamera (Shutter) -->
            <div class="w-[30%] flex justify-center">
                <button class="btn-capture w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-slate-200 border-[3px] border-slate-400 flex items-center justify-center cursor-pointer shadow-lg shadow-black/50" onclick="triggerCapture()" aria-label="Ambil Gambar">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-[3px] border-slate-100 bg-white shadow-inner"></div>
                </button>
            </div>
            
            <div class="w-[35%] text-right">
                <div class="inline-flex flex-col items-end">
                    <span class="text-[9px] text-slate-400 uppercase tracking-widest">Format</span>
                    <span id="aspectDisplay" class="text-sm sm:text-base font-bold text-amber-500 tracking-wide">2.39:1</span>
                </div>
            </div>

        </div>
    </div>

<!-- MESIN PENGGERAK UTAMA -->
    <script src="main-viewfinder.js"></script>
    
    <script>
        // 1. Inisialisasi ikon UI dari Lucide
        lucide.createIcons();

        // 2. Fungsi Jembatan: Penggantian Mode Kamera
        function selectCamera(name, width, height, el) {
            document.querySelectorAll('.cam-chip').forEach(btn => {
                btn.className = "cam-chip px-4 py-1.5 rounded-full text-[11px] font-bold border border-slate-700 bg-slate-900 text-slate-300 transition-colors cursor-pointer";
            });
            el.className = "cam-chip active px-4 py-1.5 rounded-full text-[11px] font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-colors cursor-pointer";
            
            const camDisplay = document.getElementById('camDisplay');
            if (camDisplay) camDisplay.innerText = name.toUpperCase();
            
            // Injeksi data sensor langsung ke variabel app.js (Cek Keberadaan Variabel)
            if (typeof targetCamera !== 'undefined' && targetCamera !== null) {
                targetCamera.brand = name.split(' ')[0];
                targetCamera.model = name.split(' ').slice(1).join(' ');
                targetCamera.sensorWidth = width;
                targetCamera.sensorHeight = height;
            }
        }

        // 3. Fungsi Jembatan: Penggantian Jarak Fokus Lensa (Focal Length)
        function setLens(mm, el) {
            document.querySelectorAll('.btn-lens').forEach(btn => {
                btn.className = "btn-lens px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 border border-slate-600 text-slate-100 cursor-pointer";
            });
            el.className = "btn-lens active px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-amber-500 text-slate-950 border border-amber-400 cursor-pointer";
            
            if (typeof window.activeLens !== 'undefined') {
                window.activeLens = mm;
            }
        }

        // 4. Registrasi PWA (Aplikasi Offline)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Service worker tetap butuh absolute path scope atau minimal ./sw.js
                navigator.serviceWorker.register('./sw.js').catch(err => console.error('Pendaftaran SW gagal:', err));
            });
        }
    </script>
    
</body>
</html>
